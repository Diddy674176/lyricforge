name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Pages uses GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                build_type: 'workflow',
              });
              core.info('Created Pages site (workflow build)');
            } catch (e) {
              const status = e.status || e.response?.status;
              if (status === 409 || status === 422) {
                try {
                  await github.request('PUT /repos/{owner}/{repo}/pages', {
                    owner,
                    repo,
                    build_type: 'workflow',
                  });
                  core.info('Updated Pages site to workflow build');
                } catch (e2) {
                  core.warning(`Pages already configured or update skipped: ${e2.message}`);
                }
              } else {
                core.warning(`Pages create skipped: ${e.message}`);
              }
            }

  build:
    needs: configure-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
